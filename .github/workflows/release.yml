name: release

# Runs when a version tag is pushed (git tag v0.4.0 && git push origin v0.4.0). It publishes to PyPI through trusted publishing: no token is stored anywhere.
# One-time setup on pypi.org is in docs/releasing.md. Until that is done the `publish` job fails and nothing is released.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the tag must name the version in pyproject.toml
        run: |
          python - <<'EOF'
          import os, tomllib
          want = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          have = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert want == have, f"tag {want} does not match pyproject version {have}"
          EOF
      - run: python scripts/prerelease_check.py
      - run: python -m pip install build twine
      - run: python -m build --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  smoke:
    # the built wheel, not the source tree, on all three systems
    needs: build
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/neutral" && cd "$RUNNER_TEMP/neutral"
          "$BIN/gruntly" --version
          "$BIN/gruntly" demo

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gruntly
    permissions:
      id-token: write       # trusted publishing: PyPI trusts this workflow, there is no API token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
