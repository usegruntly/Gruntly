name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    # nothing that should not be public: key-shaped strings, a real person's home path, a real email address (scripts/prerelease_check.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/prerelease_check.py

  test:
    # The whole suite, offline: fake servers and fake child CLIs, no model, no key. Tests of a real harness binary skip themselves when it is not installed.
    # macOS runs one Python: its minutes cost ten times a Linux minute on a private repository.
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.test
      - run: git config --global user.name ci
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python -m pytest tests -q -p no:cacheprovider --tb=short -ra

  package:
    # Build the wheel and sdist, check what PyPI checks, install the wheel into an empty environment and run `gruntly demo` from an unrelated folder:
    # what a stranger's first five minutes look like.
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --outdir dist
      - run: python -m twine check dist/*
      - name: install the wheel in a clean environment and run the demo
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install dist/*.whl
          mkdir "$RUNNER_TEMP/neutral" && cd "$RUNNER_TEMP/neutral"
          "$BIN/gruntly" --version
          "$BIN/gruntly" demo
