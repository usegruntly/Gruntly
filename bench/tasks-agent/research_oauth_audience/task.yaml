workload: web_research
needs_web: true
prompt: A 2026 RFC updates RFC 7521, RFC 7522, RFC 7523 and RFC 9126 to fix a vulnerability caused by ambiguous audience values in OAuth
  2.0 client assertions. Which RFC is it, and what must the audience of a JWT client authentication assertion now be?
format: 'Reply with only a JSON list. Each item is {"fact": "<one claim, in your words>", "url": "<the page you read it on>", "quote":
  "<words copied exactly from that page, at least 20 characters>"}. Every claim needs its own source and quote.'
grader:
  type: facts_cites
  facts:
  - rfc ?10070
  - issuer identifier
  - sole
