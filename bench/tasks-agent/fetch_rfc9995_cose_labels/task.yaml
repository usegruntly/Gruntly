workload: exact_fetch
needs_web: true
prompt: RFC 9995 (https://www.rfc-editor.org/rfc/rfc9995.txt, published July 2026) registers new COSE header parameters. List each parameter
  it registers with its label number.
format: 'One per line as `name: label`, for example `alg: 1`. Nothing else.'
grader:
  type: lines
  lines:
  - 'payload-hash-alg: 258'
  - 'preimage-content-type: 259'
  - 'payload-location: 260'
