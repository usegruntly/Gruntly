# Example cells for bench/run_matrix.py. A dry run prints the plan and which cells are paid; nothing starts without --run, and a paid cell
# needs --yes-paid and --max-usd as well:
#
#   python bench/run_matrix.py --cells bench/cells.example.toml --tasks slugify
#
# Fields: name, parent (any harness in `gruntly harness matrix`), mode (delegating or working), parent_model, parent_provider (a catalog provider;
# omit to use the harness's own login), child_harness, child_model, child_provider ("local" = your local model server). Pick model ids with
# `gruntly models PROVIDER`; the ones below are placeholders.

# The measured setup: Claude Code directs a Haiku child (paid: your Claude usage).
[[cell]]
name = "claude-lean-haiku"
parent = "claude"
mode = "delegating"
parent_model = "sonnet"
child_harness = "claude"
child_model = "haiku"

# The baseline for it: Sonnet does the job itself.
[[cell]]
name = "claude-alone"
parent = "claude"
mode = "working"
parent_model = "sonnet"

# A cheap lean parent through a provider you hold a key for, with a local child (hosted providers count as paid even with a free tier).
[[cell]]
name = "direct-openrouter-local"
parent = "direct"
mode = "delegating"
parent_provider = "openrouter"
parent_model = "MODEL"
child_harness = "opencode"
child_model = "qwen3.5-9b"
child_provider = "local"

# A parent on the Gemini API (it has a free tier, which is limited) and a local child.
[[cell]]
name = "gemini-lean-local"
parent = "gemini"
mode = "delegating"
parent_provider = "gemini"
parent_model = "MODEL"
child_harness = "opencode"
child_model = "qwen3.5-9b"
child_provider = "local"

# Everything on your own machine: a lean parent and a child, both on local servers (no API dollars; compute is not priced).
[[cell]]
name = "opencode-lean-local"
parent = "opencode"
mode = "delegating"
parent_provider = "lmstudio"
parent_model = "MODEL"
child_harness = "opencode"
child_model = "qwen3.5-9b"
child_provider = "local"
