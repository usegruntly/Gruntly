brief: "Fix `HelpFormatter.write_usage` producing spurious characters\n\nWhat the\
  \ maintainers wrote about the intended behaviour:\n-   Fix :meth:`HelpFormatter.write_usage`\
  \ emitting only a blank line when\n    called without ``args``. The usage prefix\
