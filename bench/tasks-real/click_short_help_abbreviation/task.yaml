brief: "Fix short help abbreviation\n\nWhat the maintainers wrote about the intended\
  \ behaviour:\n- A command's short help no longer stops at an abbreviation such as\
  \ `vs.` or `e.g.`\n  inside the first sentence. A period ends the sentence only\
  \ when it closes the text\n  or the next word does not start in lowercase."
