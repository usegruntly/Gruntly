brief: "Fix `show_envvar` output for a sequence or an empty `envvar`\n\nWhat the maintainers\
  \ wrote about the intended behaviour:\n- With `show_envvar=True`, an option's error\
  \ message now prints all variables of an\n  `envvar` sequence instead of the `repr`\
  \ of the sequence.\n- An empty `envvar`, such as `[]` or `\"\"`, shows the same\
  \ help and error message as\n  no `envvar` when `show_envvar=True`. The help screen\
  \ used to show `[env var: ]`."
