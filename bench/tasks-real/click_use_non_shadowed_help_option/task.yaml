brief: "Use non-shadowed help option name in error hint\n\nWhat the maintainers wrote\
  \ about the intended behaviour:\n-   The error hint now uses :meth:`Command.get_help_option_names`\
  \ to pick\n    non-shadowed help option names, so ``Try '... -h'`` no longer points\
  \ to a\n    subcommand option that shadows ``-h``. All surviving names are shown\n\
  \    (``-h/--help``)."
