brief: 'Products need a reorder level: a product whose quantity is at or below its
  level is low on stock. Add it end to end. It is stored with the product (store files
  saved before this change must still load, as level 0). It can be set when a product
  is added: Inventory.add(name, quantity, price, reorder_level=0), and the CLI takes
  `add NAME QTY PRICE [LEVEL]`; a negative level is an error like a negative quantity.
  Inventory.low_stock() returns the low products sorted by name. The CLI gets a `low`
  command printing one `name: quantity/level` line per low product, or `nothing is
  low`.'
allowed_paths:
- '**'
acceptance:
- cmd: python -m pytest -q
  timeout_s: 300
