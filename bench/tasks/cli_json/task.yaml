brief: 'The `tool` CLI (tool/cli.py) supports `--json` only for the `status` command.
  Add `--json` support for the

  `list`, `show`, `stats` and `users` commands, following exactly how `status` does
  it. The other commands

  (jobs, logs, config) must keep refusing --json, and text output must not change.'
allowed_paths:
- tool/**
acceptance:
- cmd: python -m pytest -q
