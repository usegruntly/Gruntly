brief: 'Rename the domain concept "customer" to "account" everywhere in this repo:
  class Customer -> Account,

  every identifier, function name (customer_summary_N -> account_summary_N, customer_label
  ->

  account_label), variable, docstring, comment and output string, in the code AND
  in the tests (case-preserving:

  Customer -> Account, customer -> account). File names stay as they are. Done means
  no occurrence of

  ''customer'' (any case) remains in any .py file and the suite passes.'
allowed_paths:
- '**'
acceptance:
- cmd: python check_names.py && python -m pytest -q
tests_writable: true
