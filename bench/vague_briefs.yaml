# Deliberately under-specified briefs: no function names, no edge cases, no method. Scope (allowed_paths) is unchanged.
# Used by bench/run_child_bench.py to measure how much planning / ambiguity-fixing a small local model can really do,
# which decides whether a task should get the `worker` profile or whether the parent must keep planning (`typist`).
slugify: >
  The slugify module should be usable for turning a page title into something safe to put in a URL.
  Make it work properly.
parse_duration: >
  The durations module should understand time strings like "1h30m" and give back something useful.
  Handle bad input sensibly.
bugs_batch: >
  Several of the small helper modules in this repo are broken. Make the whole test suite pass,
  and make the fixes robust rather than special-casing the tests.
cli_json: >
  The tool CLI can print machine-readable output for the status command. Make that available for more of its
  commands where it makes sense, without changing how anything else behaves.
