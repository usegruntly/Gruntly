[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gruntly"
version = "0.0.1"
description = "Hand the grunt work to your local model. Gruntly runs your AI coding agent's tasks on a local harness and checks the result before Claude Code takes it back."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "coding-agent", "claude-code", "local-llm"]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
gruntly = "gruntly.cli:main"
gruntly-mcp = "gruntly.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gruntly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
