# ---------------------------------------------------------------------------------------------------------------------------
# Local servers (no key, no proxy: the child talks to the server directly). `provider = "ollama"` in a spec means
# provider "local" with that server's address as the endpoint, unless the spec sets its own endpoint.
# ---------------------------------------------------------------------------------------------------------------------------

[lmstudio]
kind = "local"
responses_api = true
base_url = "http://127.0.0.1:1234/v1"
note = "LM Studio local server (the default local endpoint)"
docs = [["LM Studio local server", "https://lmstudio.ai/docs/app/api"]]

[ollama]
kind = "local"
responses_api = true
base_url = "http://127.0.0.1:11434/v1"
note = "Ollama's OpenAI-compatible endpoint"
docs = [["Ollama OpenAI compatibility", "https://github.com/ollama/ollama/blob/main/docs/openai.md"]]

[llamacpp]
kind = "local"
base_url = "http://127.0.0.1:8080/v1"
note = "llama.cpp's llama-server"
docs = [["llama-server", "https://github.com/ggml-org/llama.cpp/tree/master/tools/server"]]

[vllm]
kind = "local"
responses_api = true
base_url = "http://127.0.0.1:8000/v1"
note = "vLLM's OpenAI-compatible server"
docs = [["vLLM OpenAI-compatible server", "https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html"]]
