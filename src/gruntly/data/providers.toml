# Providers gruntly can use for a child (or, later, a parent): hosted OpenAI-compatible endpoints and local model servers.
#
# Override or add entries in ~/.config/gruntly/providers.toml (all your projects) or <project>/.gruntly/providers.toml (one project).
# A later file wins field by field, so a one-line override is enough:
#
#   [groq]
#   rpm = 20
#
# `verified = true` means a live check has passed (gruntly verify) against the provider. Every other entry comes from the
# provider's documentation and may be out of date: the limits are conservative defaults, not promises, and the model list is
# never kept here (model ids change; `gruntly models --provider NAME` asks the provider).
# `responses_api` says whether the provider serves the Responses API (Codex CLI needs it): true or false from the provider's
# documentation, absent when unknown. Not checked live.
# `default_model` is only set where it was measured to work; otherwise pick one with `gruntly models`.

# ---------------------------------------------------------------------------------------------------------------------------
# Hosted
# ---------------------------------------------------------------------------------------------------------------------------

# Gemma 4 through the Gemini API (AI Studio key). Gemma 3 is no longer listed in Google's Gemma-on-Gemini docs, and the small Gemma
# sizes are not offered there. 26B-A4B activates about 4B parameters per token. Measured (a 429 named it): 16,000 input tokens per
# minute on the free tier. The requests/min and daily numbers are not published: rpm is a guess. The API also answers 500 INTERNAL on
# about half the calls; the proxy retries those.
[gemini]
kind = "hosted"
responses_api = false
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_env = "GEMINI_API_KEY"
default_model = "gemma-4-26b-a4b-it"
rpm = 15
tpm = 15000
note = "Gemma 4 via the Gemini API"
models_api = "gemini"
free_tier = true
verified = true
docs = [["Get an API key", "https://aistudio.google.com/apikey"],
        ["Models", "https://ai.google.dev/gemini-api/docs/models"],
        ["Rate limits and free tier", "https://ai.google.dev/gemini-api/docs/rate-limits"]]

# NVIDIA NIM (build.nvidia.com). The live model list (GET /v1/models, no key needed) has google/gemma-3-4b-it, gemma-3-12b-it,
# nvidia/nemotron-3.5-lightning-30b-a3b (about 3B active), nemotron-3.5-bolt-e4b and mistral-nemo-12b; no Qwen. Listed does not mean
# usable: on a free account, gemma-3-4b/12b, nemotron-nano-3, mistral-nemo-12b and granite-3.0-8b answered 404 "Function not found for
# account"; only nemotron-3.5-bolt-e4b and nemotron-3.5-lightning-30b-a3b worked (tool calls too). About 40 requests/min on the free
# tier was reported (your account page shows the real number); no daily cap was found. Needs a phone-verified account.
[nvidia]
kind = "hosted"
base_url = "https://integrate.api.nvidia.com/v1"
key_env = "NVIDIA_API_KEY"
default_model = "nvidia/nemotron-3.5-bolt-e4b"
rpm = 30
note = "NVIDIA NIM free endpoints"
free_tier = true
verified = true
docs = [["Get an API key", "https://build.nvidia.com/settings/api-keys"],
        ["Models (use the Free Endpoint filter)", "https://build.nvidia.com/models"],
        ["Docs", "https://docs.api.nvidia.com/"]]

